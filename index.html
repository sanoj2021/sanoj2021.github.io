<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScienceDB</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2301696f'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='serif' font-size='20' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300..700&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{--bg:#f7f6f2;--surface:#f9f8f5;--surface2:#fbfbf9;--text:#28251d;--muted:#7a7974;--border:#d4d1ca;--primary:#01696f;--primary-hover:#0c4e54;--error:#a12c7b;--shadow:0 12px 32px oklch(0.2 0.01 80/.12)}
    [data-theme="dark"]{--bg:#171614;--surface:#1c1b19;--surface2:#201f1d;--text:#cdccca;--muted:#797876;--border:#393836;--primary:#4f98a3;--primary-hover:#227f8b;--error:#d163a7;--shadow:0 12px 32px oklch(0 0 0/.35)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font:16px/1.6 Inter,sans-serif;background:var(--bg);color:var(--text)}
    button,input{font:inherit}button{cursor:pointer}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:2rem}
    .card{width:min(100%,420px);background:var(--surface);border:1px solid color-mix(in oklab,var(--text) 8%,transparent);border-radius:1rem;padding:2rem;box-shadow:var(--shadow)}
    .eyebrow{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);margin-bottom:1rem}
    .title{font-family:"Instrument Serif",serif;font-size:clamp(2rem,4vw,3.25rem);line-height:1.05;margin-bottom:.75rem}
    .sub{color:var(--muted);margin-bottom:1.5rem}
    label{display:block;font-size:.92rem;margin-bottom:.35rem}
    input{width:100%;padding:.85rem 1rem;border-radius:.75rem;border:1px solid var(--border);background:var(--surface2);color:var(--text);margin-bottom:1rem}
    .btn{width:100%;padding:.95rem 1rem;border:none;border-radius:.8rem;background:var(--primary);color:white;font-weight:700}
    .btn:hover{background:var(--primary-hover)}
    .err{display:none;color:var(--error);font-size:.85rem;margin-top:.75rem}
    .err.show{display:block}
    .head{position:fixed;top:0;left:0;right:0;padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;z-index:10}
    .logo{font-family:"Instrument Serif",serif;font-size:1.2rem}
    .theme-btn{border:1px solid color-mix(in oklab,var(--text) 10%,transparent);background:var(--surface);color:var(--text);width:42px;height:42px;border-radius:999px}
  </style>
</head>
<body>
  <header class="head">
    <div class="logo">ScienceDB</div>
    <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">&#9680;</button>
  </header>
  <main class="wrap">
    <section class="card">
      <div class="eyebrow">Knowledge Graph Prototype</div>
      <h1 class="title">Login to ScienceDB</h1>
      <p class="sub">Atomic facts, linked evidence, and crowd-driven credibility.</p>
      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button class="btn" type="submit">Enter app</button>
        <div class="err" id="err">Incorrect username or password.</div>
      </form>
    </section>
  </main>
  <script>
    const USERS=[{username:'mrNobody',password:'NdQUQbCMHXbheY5skllU'}];
    const root=document.documentElement;
    let theme=root.getAttribute('data-theme')||'dark';
    document.getElementById('themeBtn').onclick=()=>{
      theme=theme==='dark'?'light':'dark';
      root.setAttribute('data-theme',theme);
    };
    document.getElementById('loginForm').addEventListener('submit',e=>{
      e.preventDefault();
      const u=document.getElementById('username').value.trim();
      const p=document.getElementById('password').value;
      const ok=USERS.some(x=>x.username===u&&x.password===p);
      if(ok){sessionStorage.setItem('scienceDbUser',u);window.location.href='./app/';}
      else{document.getElementById('err').classList.add('show');}
    });
  </script>
</body>
</html>
